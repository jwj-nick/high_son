<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>map render</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
html,body{margin:0;padding:0;background:#fff;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
#map{width:800px;height:900px}
.lbl{background:rgba(255,255,255,.93);border:1.5px solid #7c4a1e;border-radius:6px;padding:2px 7px;font-size:14px;font-weight:800;color:#2b2118;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25);line-height:1.3}
.lbl.red{border-color:#b91c1c;color:#b91c1c}
.lbl.green{border-color:#166534;color:#166534}
.lbl.grey{border-color:#6b5a48;color:#6b5a48;font-weight:700;background:rgba(255,255,255,.85)}
.lbl small{display:block;font-size:11px;font-weight:600;color:#5b4a3a}
.lbl.L{transform:translate(-100%,-50%)} .lbl.R{transform:translate(0,-50%)} .lbl.T{transform:translate(-50%,-100%)} .lbl.B{transform:translate(-50%,0)}
.num{background:#7c4a1e;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.num.red{background:#b91c1c}.num.green{background:#166534}
.leaflet-control-attribution{font-size:11px}
.title{position:absolute;z-index:1000;left:10px;top:10px;background:rgba(255,255,255,.95);border:1.5px solid #7c4a1e;border-radius:8px;padding:6px 10px;font-size:15px;font-weight:900;color:#2b2118;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.title small{display:block;font-size:11.5px;font-weight:600;color:#5b4a3a}
</style>
</head>
<body>
<div id="map"></div>
<script>
var q=new URLSearchParams(location.search); var which=q.get('m')||'route';
var W=parseInt(q.get('w')||'800'), H=parseInt(q.get('h')||'900');
document.getElementById('map').style.width=W+'px'; document.getElementById('map').style.height=H+'px';
var map=L.map('map',{zoomControl:false,attributionControl:true,zoomSnap:0.25});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);

var P={
 pyongyang:[39.02,125.75], seoul:[37.57,126.98], singyesa:[38.66,128.11], bukcheong:[40.25,128.36], huchi:[40.60,128.12],
 vladivostok:[43.12,131.89], bongodong:[43.00,129.78], cheongsanri:[42.47,128.83], daejeon:[36.37,127.29],
 baekdu:[41.99,128.08], kyzylorda:[44.85,65.51], moscow:[55.75,37.62], tumen_city:[42.97,129.85]
};
function lbl(pos,html,cls,side){ side=side||'R'; var a={R:[-14,0],L:[14,0],T:[0,14],B:[0,-14]}[side]; L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="lbl '+(cls||'')+' '+side+'">'+html+'</div>',iconSize:null,iconAnchor:a}),interactive:false}).addTo(map); }
function num(pos,n,cls){ L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="num '+(cls||'')+'">'+n+'</div>',iconSize:[22,22],iconAnchor:[11,11]}),interactive:false}).addTo(map); }
function dot(pos,color,r){ L.circleMarker(pos,{radius:r||7,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(map); }
function title(t,s){ var d=document.createElement('div'); d.className='title'; d.innerHTML=t+(s?'<small>'+s+'</small>':''); document.getElementById('map').appendChild(d); }

if(which==='route'){
  var route=[P.pyongyang,P.seoul,P.singyesa,P.bukcheong,P.huchi,P.vladivostok,P.bongodong,P.cheongsanri];
  L.polyline(route,{color:'#b45309',weight:4,opacity:.9,dashArray:'8 6'}).addTo(map);
  L.polyline([P.cheongsanri,[43.55,126.9]],{color:'#6b5a48',weight:3,opacity:.8,dashArray:'4 6'}).addTo(map);
  dot(P.pyongyang,'#7c4a1e'); num(P.pyongyang,'1'); lbl(P.pyongyang,'평양<small>1868 출생 · 15세 입대</small>','','L');
  dot(P.seoul,'#7c4a1e'); num(P.seoul,'2'); lbl(P.seoul,'한양<small>파견 근무</small>','','R');
  dot(P.singyesa,'#7c4a1e'); num(P.singyesa,'3'); lbl(P.singyesa,'금강산 신계사<small>22세, 글을 깨움</small>','','R');
  dot(P.bukcheong,'#7c4a1e'); num(P.bukcheong,'4'); lbl(P.bukcheong,'북청<small>사냥꾼 · 포수 대장</small>','','R');
  dot(P.huchi,'#7c4a1e'); lbl(P.huchi,'후치령<small>1907.11 첫 전투</small>','','L');
  dot(P.vladivostok,'#7c4a1e'); num(P.vladivostok,'5'); lbl(P.vladivostok,'연해주(블라디보스토크)<small>~1919 기다림</small>','','B');
  dot(P.bongodong,'#b91c1c',9); num(P.bongodong,'6','red'); lbl(P.bongodong,'봉오동<small>1920.6.7 봉오동전투</small>','red','T');
  dot(P.cheongsanri,'#b91c1c',9); num(P.cheongsanri,'7','red'); lbl(P.cheongsanri,'청산리<small>1920.10 완루구·어랑촌</small>','red','B');
  lbl([43.55,126.9],'⑧ → 러시아(모스크바) → 카자흐스탄<small>1921~ · 1937 강제 이주 · 1943 사망</small>','grey','L');
  lbl(P.baekdu,'▲ 백두산','grey','L');
  dot(P.daejeon,'#166534'); num(P.daejeon,'9','green'); lbl(P.daejeon,'국립대전현충원<small>2021.8.15 유해 봉환</small>','green','R');
  title('홍범도의 일생 이동 경로','① 평양 → ② 한양 → ③ 금강산 → ④ 북청·후치령 → ⑤ 연해주 → ⑥ 봉오동 → ⑦ 청산리 → ⑧ 러시아·카자흐스탄 → ⑨ 대전(유해)');
  map.fitBounds([[35.8,124.0],[44.3,132.8]],{padding:[0,0]});
}
if(which==='huchi'){
  dot(P.bukcheong,'#7c4a1e',8); lbl(P.bukcheong,'북청<small>홍범도의 사냥 터전 · 포수들의 대장</small>','','R');
  dot(P.huchi,'#b91c1c',9); lbl(P.huchi,'후치령(약 1,335m)<small>1907.11 산포수 의병 첫 매복 · 3시간 격전</small>','red','T');
  L.polyline([P.bukcheong,P.huchi],{color:'#b45309',weight:4,dashArray:'8 6'}).addTo(map);
  lbl([40.42,128.24],'북청 → 내륙(풍산)으로 가는 교통 요지','grey','R');
  title('후치령 — 사냥꾼의 총이 일본군을 향한 곳','함경남도 북청군과 풍산군 사이의 고개. 일본군이 자주 지나는 길목이라 매복하기 좋았다.');
  map.fitBounds([[39.85,127.4],[41.05,129.2]]);
}
if(which==='gando'){
  dot(P.bongodong,'#b91c1c',10); lbl(P.bongodong,'봉오동<small>1920.6.7 · 대한북로독군부 700여 명 · 유인·포위</small>','red','T');
  dot(P.cheongsanri,'#b91c1c',10); lbl(P.cheongsanri,'청산리<small>1920.10.21~ 완루구 · 어랑촌(김좌진과 협공) · 10전 10승</small>','red','B');
  L.polyline([P.bongodong,P.cheongsanri],{color:'#b45309',weight:4,dashArray:'8 6'}).addTo(map);
  lbl(P.baekdu,'▲ 백두산<small>홍범도가 근거지를 옮기려던 곳</small>','grey','L');
  lbl([43.4,128.4],'북간도(중국 만주) — 조선인 25만 명(75%)','grey','R');
  lbl([42.25,129.9],'두만강 ↓ 건너면 함경북도(조선)','grey','R');
  title('북간도 — 봉오동전투와 청산리전투의 무대','두만강 북쪽 중국 땅. 일본군 월강추격대대가 통고 없이 두만강을 건너 봉오동으로 쫓아왔다.');
  map.fitBounds([[41.8,127.6],[43.6,130.6]]);
}
if(which==='wide'){
  L.polyline([P.vladivostok,P.kyzylorda],{color:'#6b5a48',weight:4,dashArray:'10 8'}).addTo(map);
  L.polyline([P.kyzylorda,P.daejeon],{color:'#166534',weight:2,dashArray:'3 8',opacity:.8}).addTo(map);
  dot(P.vladivostok,'#7c4a1e',8); lbl(P.vladivostok,'블라디보스토크<small>1937 강제 이주 기차 출발</small>','','T');
  lbl([53.5,53.5],'← 모스크바(서쪽 약 2,000km)<small>1921~ 지원 요청 · 1922 극동민족대회</small>','grey','R');
  dot(P.kyzylorda,'#b91c1c',10); lbl(P.kyzylorda,'카자흐스탄 크즐오르다<small>1937~1943 · 홍범도 거리·동상·추모공원</small>','red','R');
  dot(P.daejeon,'#166534',8); lbl(P.daejeon,'대전<small>2021 유해 봉환</small>','green','B');
  lbl([46.2,102],'기차로 40여 일 (17만여 명 고려인)','grey','T');
  lbl([38.6,100],'대한민국에서 약 5,000km','green','T');
  title('카자흐스탄은 왜 홍범도를 기리나','1937년 소련은 고려인 17만여 명을 중앙아시아로 강제 이주시켰다. 홍범도는 그곳에서 1943년 세상을 떠났다.');
  map.fitBounds([[27,52],[60,140]]);
}
</script>
</body>
</html>
