<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect width="1200" height="340" fill="#f4f6f4"/>

  <!-- 제목 -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1f3d">그라운드 밖의 진화 — 축구가 바꾼 사회와 산업</text>
  <text x="600" y="53" text-anchor="middle" font-size="12" fill="#777">전개 방법: 비교·대조 (옛 축구산업 vs 현대 축구산업)</text>

  <defs>
    <clipPath id="c1"><rect x="50" y="68" width="260" height="235" rx="10"/></clipPath>
    <clipPath id="c2"><rect x="330" y="68" width="260" height="235" rx="10"/></clipPath>
    <clipPath id="c3"><rect x="610" y="68" width="260" height="235" rx="10"/></clipPath>
    <clipPath id="c4"><rect x="890" y="68" width="260" height="235" rx="10"/></clipPath>
  </defs>

  <!-- ─── 박스 1: OTT 미디어 ─── -->
  <rect x="50" y="68" width="260" height="235" rx="10" fill="white" stroke="#1b5e20" stroke-width="2"/>
  <!-- 헤더 (클립으로 위 둥근 모서리 처리) -->
  <rect x="50" y="68" width="260" height="52" fill="#1b5e20" clip-path="url(#c1)"/>
  <text x="180" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="white">OTT 미디어</text>
  <text x="180" y="109" text-anchor="middle" font-size="11" fill="#c8e6c9">쿠팡플레이</text>
  <!-- 핵심 수치 -->
  <text x="180" y="162" text-anchor="middle" font-size="50" font-weight="900" fill="#1b5e20">50+</text>
  <text x="180" y="184" text-anchor="middle" font-size="13" fill="#444">리그 동시 중계</text>
  <!-- 구분선 -->
  <line x1="70" y1="200" x2="290" y2="200" stroke="#1b5e20" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Before / After -->
  <text x="180" y="220" text-anchor="middle" font-size="11" fill="#888">예전: 지상파 1~2개 리그</text>
  <text x="180" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">지금: 스트리밍 점유율 2위</text>
  <!-- 출처 -->
  <text x="180" y="291" text-anchor="middle" font-size="10" fill="#aaa">출처: 쿠팡플레이 공식</text>

  <!-- ─── 박스 2: 스타 마케팅 ─── -->
  <rect x="330" y="68" width="260" height="235" rx="10" fill="white" stroke="#c97316" stroke-width="2"/>
  <rect x="330" y="68" width="260" height="52" fill="#c97316" clip-path="url(#c2)"/>
  <text x="460" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="white">스타 마케팅</text>
  <text x="460" y="109" text-anchor="middle" font-size="11" fill="#fff3e0">손흥민 (LAFC)</text>
  <text x="460" y="162" text-anchor="middle" font-size="50" font-weight="900" fill="#c97316">156억</text>
  <text x="460" y="184" text-anchor="middle" font-size="13" fill="#444">광고료 / 연간</text>
  <line x1="350" y1="200" x2="570" y2="200" stroke="#c97316" stroke-opacity="0.2" stroke-width="1"/>
  <text x="460" y="220" text-anchor="middle" font-size="11" fill="#888">예전: 경기장 활약만 가치</text>
  <text x="460" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#c97316">지금: 글로벌 브랜드 가치</text>
  <text x="460" y="291" text-anchor="middle" font-size="10" fill="#aaa">출처: 한국 언론 보도</text>

  <!-- ─── 박스 3: 구단 수익 ─── -->
  <rect x="610" y="68" width="260" height="235" rx="10" fill="white" stroke="#0f1f3d" stroke-width="2"/>
  <rect x="610" y="68" width="260" height="52" fill="#0f1f3d" clip-path="url(#c3)"/>
  <text x="740" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="white">구단 수익</text>
  <text x="740" y="109" text-anchor="middle" font-size="11" fill="#b0c4de">토트넘 동아시아 투어</text>
  <text x="740" y="162" text-anchor="middle" font-size="50" font-weight="900" fill="#0f1f3d">800억</text>
  <text x="740" y="184" text-anchor="middle" font-size="13" fill="#444">동아시아 추가 수익</text>
  <line x1="630" y1="200" x2="850" y2="200" stroke="#0f1f3d" stroke-opacity="0.2" stroke-width="1"/>
  <text x="740" y="220" text-anchor="middle" font-size="11" fill="#888">예전: 리그 티켓·중계권</text>
  <text x="740" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1f3d">지금: 글로벌 투어·굿즈</text>
  <text x="740" y="291" text-anchor="middle" font-size="10" fill="#aaa">출처: 한국 언론 보도</text>

  <!-- ─── 박스 4: 데이터·AI ─── -->
  <rect x="890" y="68" width="260" height="235" rx="10" fill="white" stroke="#a23b3b" stroke-width="2"/>
  <rect x="890" y="68" width="260" height="52" fill="#a23b3b" clip-path="url(#c4)"/>
  <text x="1020" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="white">데이터 · AI</text>
  <text x="1020" y="109" text-anchor="middle" font-size="11" fill="#ffcdd2">150년치 경기 데이터</text>
  <text x="1020" y="162" text-anchor="middle" font-size="50" font-weight="900" fill="#a23b3b">24시간</text>
  <text x="1020" y="184" text-anchor="middle" font-size="13" fill="#444">시뮬레이션 완료</text>
  <line x1="910" y1="200" x2="1130" y2="200" stroke="#a23b3b" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1020" y="220" text-anchor="middle" font-size="11" fill="#888">예전: 감독의 직관·필름</text>
  <text x="1020" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#a23b3b">지금: 데이터 기반 전술</text>
  <text x="1020" y="291" text-anchor="middle" font-size="10" fill="#aaa">출처: 『축구 전술 혁명』</text>

  <!-- 하단 캡션 -->
  <text x="600" y="324" text-anchor="middle" font-size="12" font-style="italic" fill="#666">
    출처: 다쓰오카 아유무 『축구 전술 혁명』 / 쿠팡플레이 공식 / FIFA 공식 / 한국 언론 보도 종합
  </text>
</svg>
