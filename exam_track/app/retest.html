<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 재시험</title>
<style>
  :root{
    --bg:#F4F6F8; --card:#FFFFFF; --card2:#F9FAFB;
    --ink:#182029; --ink2:#4E5A67; --ink3:#828D99;
    --line:#E1E6EB;
    --accent:#3E5C76; --accent-soft:#E8EEF4;
    --ember:#BB5334; --ember-soft:#FBEDE8;
    --ok:#2A7A57; --ok-soft:#E6F3ED;
    --warn:#9A6B12; --warn-soft:#FCF1DC;
    --r:10px;
    --sans:"Segoe UI","Malgun Gothic",-apple-system,system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161B; --card:#191F26; --card2:#1E252D;
      --ink:#E5E9ED; --ink2:#A3ADB8; --ink3:#79838E;
      --line:#2A323B;
      --accent:#7FA6C6; --accent-soft:#1C2833;
      --ember:#E08A68; --ember-soft:#2D1D17;
      --ok:#5CBB8C; --ok-soft:#152720;
      --warn:#D6A544; --warn-soft:#2A2213;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}

  header{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
  .date{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  h1{margin:0;font-size:22px;letter-spacing:-.02em}
  .sub{font-size:13.5px;color:var(--ink2)}

  nav{display:flex;gap:6px;margin:14px 0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px}
  nav button{flex:1;min-height:40px;border:none;background:none;color:var(--ink2);font:inherit;font-size:13.5px;font-weight:600;border-radius:7px;cursor:pointer;padding:6px 4px}
  nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .card.done{border-color:var(--ok);background:var(--ok-soft)}
  .card.miss{border-color:var(--ember);background:var(--ember-soft)}

  .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .no{font-family:var(--mono);font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .q{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .meta{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

  .open{display:block;text-align:center;min-height:46px;line-height:46px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px}
  .open:active{filter:brightness(.93)}

  .ask{margin-top:12px;font-size:13px;color:var(--ink2)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
  .row.two{grid-template-columns:repeat(2,1fr)}
  .row button{min-height:44px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);font:inherit;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;padding:4px}
  .row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .row.res button[aria-pressed="true"][data-v="correct"]{background:var(--ok);border-color:var(--ok)}
  .row.res button[aria-pressed="true"][data-v="wrong"]{background:var(--ember);border-color:var(--ember)}
  .row button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .after{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2);display:none}
  .card.answered .after{display:block}
  .after b{color:var(--ink)}
  .tagline{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:4px}

  .copybox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:18px}
  .copybox textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:10px;resize:vertical}
  .copybox button{margin-top:8px;width:100%;min-height:46px;border:none;border-radius:8px;background:var(--ember);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}

  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
  .stat div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
  .stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  h2{font-size:15px;margin:20px 0 8px;letter-spacing:-.01em}
  .barlist{display:flex;flex-direction:column;gap:7px}
  .bl{display:grid;grid-template-columns:112px 1fr 26px;gap:8px;align-items:center;font-size:13px}
  .bl .t{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bl .g{height:16px;background:var(--card2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .bl .g i{display:block;height:100%;background:var(--accent)}
  .bl .n{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}

  .alertbox{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:13.5px}
  .alertbox b{color:var(--warn)}
  a.solve{display:block;text-decoration:none;color:inherit;background:var(--ember-soft);
          border:1px solid var(--ember);border-radius:var(--r);padding:16px;margin-bottom:14px}
  a.solve:hover{background:var(--card)}
  a.solve:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
  a.solve .sn{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
              text-transform:uppercase;color:var(--ember)}
  a.solve .sh{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
  a.solve .sd{display:block;font-size:13px;color:var(--ink2);margin-top:6px}
  .empty{text-align:center;color:var(--ink3);padding:36px 10px;font-size:14px}
  ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.plain li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:center}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="date" id="hdate">—</span>
    <h1 id="htitle">오늘의 재시험</h1>
    <span class="sub" id="hsub"></span>
  </header>

  <nav role="tablist">
    <button role="tab" id="t-quiz"  aria-selected="true"  onclick="tab('quiz')">🔁 재시험</button>
    <button role="tab" id="t-stat"  aria-selected="false" onclick="tab('stat')">📊 약점 현황</button>
    <button role="tab" id="t-learn" aria-selected="false" onclick="tab('learn')">📚 학습 대기</button>
  </nav>

  <section id="p-quiz">
    <div class="bar"><i id="prog"></i></div>
    <div id="list"></div>
    <div class="copybox" id="copybox" hidden>
      <div style="font-size:13.5px;color:var(--ink2);margin-bottom:8px">다 풀었으면 아래 내용을 아빠에게 보내면 돼. 기록해서 다음 일정을 잡아줄게.</div>
      <textarea id="out" readonly></textarea>
      <button onclick="copyOut()" id="copybtn">결과 복사</button>
    </div>
  </section>

  <section id="p-stat" hidden></section>
  <section id="p-learn" hidden></section>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.RETEST_DATA;
  if (!D) { document.getElementById('list').innerHTML =
    '<div class="empty">data.js를 찾지 못했습니다.<br>' +
    '<code>python exam_track/tools/build_retest.py</code> 를 먼저 실행하세요.</div>'; return; }

  var KEY = 'retest:' + D.generated;
  var state = load();

  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  var CONF = [['sure','확신'],['half','반신반의'],['guess','찍음'],['timeout','시간부족']];

  /* ---------- 재시험 ---------- */
  function renderQuiz(){
    var d = D.daily, host = document.getElementById('list');
    document.getElementById('hdate').textContent = D.generated;
    if (!d.length){
      host.innerHTML = '<div class="empty">오늘 예정된 재시험이 없어. 🎉</div>';
      document.getElementById('hsub').textContent = '오늘은 쉬는 날';
      return;
    }
    document.getElementById('hsub').textContent =
      d.length + '문항 · 예상 ' + (d.length * 3) + '분';

    // 문제은행에서 온 것은 앱에서 그대로 다시 푼다 — 자기 채점을 손으로 적을 필요가 없다.
    // 아래 수동 카드는 문제은행 밖(학교 시험지 오답노트 등)의 항목만 쓴다.
    var B = D.bank || {}, head = '';
    if (B.url && B.count){
      head = '<a class="solve" href="' + esc(B.url) + '">' +
             '<span class="sn">문제은행 ' + B.count + '문항</span>' +
             '<span class="sh">앱에서 바로 풀기 →</span>' +
             '<span class="sd">풀면 자동으로 채점되고, 결과를 복사해 주면 다음 일정이 잡혀.</span></a>';
    }
    var manual = d.filter(function(x){ return !x.bank_set; });
    if (B.count && !manual.length){
      host.innerHTML = head;
      return;
    }

    host.innerHTML = head + manual.map(function(x,i){
      var s = state[x.id] || {};
      var app = x.links && x.links.app ? '../../' + x.links.app : '';
      var cls = s.result ? ' answered ' + (s.result==='correct'?'done':'miss') : '';
      return '<div class="card' + cls + '" id="c-' + esc(x.id) + '">' +
        '<div class="top">' +
          '<span class="no">' + (i+1) + ' / ' + manual.length + '</span>' +
          '<span class="q">' + esc(x.subject) + ' ' + esc(x.q) + '</span>' +
          '<span class="meta">' + (x.points ? x.points.toFixed(1) + '점 · ' : '') + x.meets + '번째</span>' +
        '</div>' +
        (app ? '<a class="open" href="' + esc(app) + '" target="_blank" rel="noopener">문제 열기</a>'
             : '<div class="empty" style="padding:12px">문제 링크 없음</div>') +
        '<div class="ask">답할 때 어느 쪽이었어?</div>' +
        '<div class="row">' + CONF.map(function(c){
          return '<button data-k="conf" data-id="' + esc(x.id) + '" data-v="' + c[0] + '" aria-pressed="' +
                 (s.conf===c[0]) + '">' + c[1] + '</button>'; }).join('') + '</div>' +
        '<div class="ask">채점 결과는?</div>' +
        '<div class="row two res">' +
          '<button data-k="res" data-id="' + esc(x.id) + '" data-v="correct" aria-pressed="' + (s.result==='correct') + '">맞음</button>' +
          '<button data-k="res" data-id="' + esc(x.id) + '" data-v="wrong"   aria-pressed="' + (s.result==='wrong')   + '">틀림</button>' +
        '</div>' +
        '<div class="after">' +
          '<b>지난번 원인</b> — ' + esc(D.cause_labels[x.cause] || x.cause) +
          (x.cause_detail ? ': ' + esc(x.cause_detail) : '') +
          '<div class="tagline">' + esc(x.topic.join(' · ')) + '</div>' +
          (D.cause_remedy[x.cause] ? '<div style="margin-top:6px">💡 ' + esc(D.cause_remedy[x.cause]) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    sync();
  }

  document.addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-k]');
    if (!b) return;
    var id = b.getAttribute('data-id'), k = b.getAttribute('data-k'), v = b.getAttribute('data-v');
    var s = state[id] || (state[id] = {});
    if (k === 'conf')  s.conf   = (s.conf === v ? null : v);
    if (k === 'res')   s.result = (s.result === v ? null : v);
    save(); renderQuiz();
  });

  function sync(){
    // 문제은행 항목은 bank.html이 자기 결과 텍스트를 따로 만든다. 여기서 세면 이중 기록이 된다.
    var d = D.daily.filter(function(x){ return !x.bank_set; });
    var answered = d.filter(function(x){ return (state[x.id]||{}).result; });
    document.getElementById('prog').style.width = (d.length ? answered.length/d.length*100 : 0) + '%';
    var box = document.getElementById('copybox');
    box.hidden = answered.length === 0;
    document.getElementById('out').value = '재시험 결과 ' + D.generated + '\n' +
      answered.map(function(x){
        var s = state[x.id];
        var c = s.conf ? '(' + (CONF.filter(function(y){return y[0]===s.conf;})[0]||['','?'])[1] + ')' : '';
        return x.subject + ' ' + x.q + ' ' + (s.result==='correct'?'맞음':'틀림') + c;
      }).join('\n');
    document.getElementById('copybtn').textContent =
      answered.length === d.length ? '결과 복사 (전부 완료)' : '결과 복사 (' + answered.length + '/' + d.length + ')';
  }

  window.copyOut = function(){
    var t = document.getElementById('out');
    t.select(); t.setSelectionRange(0, 99999);
    var done = function(){ var b=document.getElementById('copybtn'); var o=b.textContent;
      b.textContent='복사했어 ✓'; setTimeout(function(){ b.textContent=o; }, 1600); };
    if (navigator.clipboard) { navigator.clipboard.writeText(t.value).then(done, function(){ try{document.execCommand('copy');done();}catch(e){} }); }
    else { try{ document.execCommand('copy'); done(); }catch(e){} }
  };

  /* ---------- 약점 현황 ---------- */
  function bars(obj, labels){
    var max = Math.max.apply(null, [1].concat(Object.keys(obj).map(function(k){return obj[k];})));
    return '<div class="barlist">' + Object.keys(obj).map(function(k){
      return '<div class="bl"><span class="t">' + esc((labels && labels[k]) ? k + ' ' + labels[k] : k) + '</span>' +
        '<span class="g"><i style="width:' + (obj[k]/max*100) + '%"></i></span>' +
        '<span class="n">' + obj[k] + '</span></div>';
    }).join('') + '</div>';
  }

  function renderStat(){
    var s = D.stats, h = [];
    h.push('<div class="stat">' +
      tile('총 오답', s.total) +
      tile('출제 대기', s.by_state.scheduled || 0) +
      tile('학습 대기', s.by_state.learning || 0) +
      tile('통과', s.by_state.mastered || 0) + '</div>');

    if (s.misconceptions.length)
      h.push('<div class="alertbox"><b>오개념 ' + s.misconceptions.length + '건</b> — 확신하고 틀린 것. 스스로는 안다고 믿고 있어서 가장 위험하다. 최우선으로 다시 본다.</div>');
    if (s.repeat_wrong.length)
      h.push('<div class="alertbox"><b>반복 오답 ' + s.repeat_wrong.length + '건</b> — 같은 처치로 두 번 실패했다면 원인 진단이 틀렸을 가능성이 크다. 재진단 필요.</div>');
    if (s.cross_subject_causes.length)
      h.push('<div class="alertbox"><b>과목을 가로지르는 원인: ' + s.cross_subject_causes.map(function(c){
        return c + ' ' + (D.cause_labels[c]||''); }).join(', ') +
        '</b> — 과목 문제가 아니라 읽기·구별 습관 문제일 수 있다.</div>');
    if (s.gaps_pending)
      h.push('<div class="alertbox"><b>결측 ' + s.gaps_pending + '건</b> — 채점 결과나 확신도가 비어 있다. 다음 시험부터는 시험지에 바로 표시하자.</div>');

    h.push('<h2>왜 틀렸나 (원인)</h2>' + bars(s.by_cause, D.cause_labels));
    h.push('<h2>과목</h2>' + bars(s.by_subject));
    h.push('<h2>단원</h2>' + bars(s.by_topic));
    h.push('<h2>답할 때 확신도</h2>' + bars(s.by_confidence, D.confidence_labels));
    document.getElementById('p-stat').innerHTML = h.join('');
  }
  function tile(k,v){ return '<div><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div></div>'; }

  /* ---------- 학습 대기 ---------- */
  function renderLearn(){
    var L = D.learning;
    var h = '<div class="alertbox">여기 있는 문항은 <b>재시험에 나오지 않는다.</b> 모르는 걸 다시 물으면 또 찍게 될 뿐이다. 개념을 먼저 보고 "학습 완료"라고 알려주면 다음날부터 출제된다.</div>';
    h += L.length ? '<ul class="plain">' + L.map(function(x){
      var app = x.links && x.links.app ? '../../' + x.links.app : '';
      return '<li><div class="top"><span class="q">' + esc(x.subject) + ' ' + esc(x.q) + '</span></div>' +
        '<div style="font-size:13px;color:var(--ink2)">' + esc(x.reason) + '</div>' +
        '<div class="tagline">' + esc(x.topic.join(' · ')) + '</div>' +
        (app ? '<a class="open" style="margin-top:10px" href="' + esc(app) + '" target="_blank" rel="noopener">개념 보기</a>' : '') +
        '</li>'; }).join('') + '</ul>'
      : '<div class="empty">학습 대기 중인 문항이 없어.</div>';
    document.getElementById('p-learn').innerHTML = h;
  }

  /* ---------- 탭 ---------- */
  window.tab = function(n){
    ['quiz','stat','learn'].forEach(function(x){
      document.getElementById('p-'+x).hidden = (x !== n);
      document.getElementById('t-'+x).setAttribute('aria-selected', String(x === n));
    });
  };

  renderQuiz(); renderStat(); renderLearn();
  document.getElementById('foot').textContent =
    'exam_track · 생성 ' + D.generated + ' · 상한 ' + D.cap + '문항 · 간격 ' + D.ladder.join('/') + '일';
})();
</script>
</body>
</html>
